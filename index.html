<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Astronaut City Runner 3D</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0f172a; font-family: 'Quicksand', sans-serif; }
    
    #canvas-container { width: 100vw; height: 100vh; display: block; position: absolute; inset: 0; }

    /* Top HUD */
    .hud {
      position: absolute; top: 16px; left: 16px; right: 16px;
      display: flex; justify-content: space-between; align-items: center;
      pointer-events: none; z-index: 10;
    }
    .hud-box {
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px);
      border: 2px solid #38bdf8; border-radius: 16px;
      padding: 6px 16px; color: #fff; text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    .hud-box small { font-size: 10px; color: #38bdf8; font-weight: 700; letter-spacing: 1px; display: block; }
    .hud-box b { font-family: 'Fredoka One', cursive; font-size: 22px; color: #facc15; }

    #swipe-zone { position: absolute; inset: 0; z-index: 5; }

    /* Overlay / Modals */
    .overlay {
      position: absolute; inset: 0; background: radial-gradient(circle at center, rgba(15,23,42,0.88) 0%, rgba(2,6,23,0.95) 100%);
      backdrop-filter: blur(8px); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 20;
    }
    .overlay.hide { display: none !important; }
    .card {
      background: #1e293b; border: 2px solid #38bdf8; border-radius: 28px; padding: 30px 34px;
      text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.8); max-width: 320px; width: 90%;
    }
    .card h2 { font-family: 'Fredoka One', cursive; font-size: 32px; color: #38bdf8; margin-bottom: 8px; }
    .card p { color: #cbd5e1; font-size: 14px; margin-bottom: 22px; font-weight: 700; }
    .card .btn-play {
      background: #22c55e; color: #0f172a; border: 0; font-family: 'Fredoka One', cursive; font-size: 22px;
      padding: 12px 34px; border-radius: 999px; cursor: pointer; box-shadow: 0 6px 0 #15803d;
      transition: transform 0.1s; letter-spacing: 1px;
    }
    .card .btn-play:active { transform: translateY(4px); box-shadow: 0 2px 0 #15803d; }

    #loading-screen {
      position: fixed; inset: 0; background: #0f172a; color: #38bdf8;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      font-family: 'Fredoka One', cursive; font-size: 22px; z-index: 100;
    }
    .load-bar-wrap { width: 220px; height: 10px; background: rgba(255,255,255,0.1); border-radius: 999px; margin-top: 14px; overflow: hidden; }
    #load-bar { width: 0%; height: 100%; background: #22c55e; transition: width 0.2s; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

<div id="loading-screen">
  <span id="load-text">PREPARING 3D CITY (0%)</span>
  <div class="load-bar-wrap"><div id="load-bar"></div></div>
</div>

<div class="hud">
  <div class="hud-box"><small>DISTANCE</small><b id="distVal">0m</b></div>
  <div class="hud-box"><small>COINS</small><b id="coinVal">0</b></div>
</div>

<div id="swipe-zone"></div>
<div id="canvas-container"></div>

<div class="overlay" id="modalOverlay">
  <div class="card">
    <h2 id="modalTitle">SPACE RUNNER</h2>
    <p id="modalDesc">Dodge Police Cars in the City!<br>Swipe Left/Right to change lanes.<br>Swipe Up to Jump!</p>
    <button class="btn-play" id="modalBtn">START RUN</button>
  </div>
</div>

<script>
// --- Sound Engine ---
const Sound = {
  ctx: null,
  init() {
    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
  },
  coin() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.frequency.setValueAtTime(987, this.ctx.currentTime);
    osc.frequency.setValueAtTime(1318, this.ctx.currentTime + 0.08);
    g.gain.setValueAtTime(0.15, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.25);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.25);
  },
  jump() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(240, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(680, this.ctx.currentTime + 0.15);
    g.gain.setValueAtTime(0.18, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.2);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.2);
  },
  crash() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(180, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.35);
    g.gain.setValueAtTime(0.25, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.4);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.4);
  }
};

// --- Three.js Scene ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x38bdf8);
scene.fog = new THREE.Fog(0x38bdf8, 30, 115);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 4.4, 7.8);
camera.lookAt(0, 1.4, -6);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('canvas-container').appendChild(renderer.domElement);

// Lights
const ambient = new THREE.AmbientLight(0xffffff, 0.95);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xffffff, 1.3);
sun.position.set(12, 28, 16);
sun.castShadow = true;
sun.shadow.mapSize.width = 1024;
sun.shadow.mapSize.height = 1024;
scene.add(sun);

// 3 Running Lanes
const LANES = [-2.4, 0, 2.4];
let currentLane = 1;
let targetX = 0;
let isJumping = false;
let jumpVelocity = 0;
const gravity = 0.024;

// --- Assets Master Template Dictionary ---
const ASSETS = {
  car: null,
  tree: null,
  bldgRed: null,
  bldgLarge: null
};

// Loading Manager with Progress Bar
const manager = new THREE.LoadingManager();
manager.onProgress = function(item, loaded, total) {
  const pct = Math.floor((loaded / total) * 100);
  document.getElementById('load-text').textContent = `PREPARING 3D CITY (${pct}%)`;
  document.getElementById('load-bar').style.width = pct + "%";
};
manager.onLoad = function() {
  setTimeout(() => {
    document.getElementById('loading-screen').style.display = 'none';
  }, 400);
};

const loader = new THREE.GLTFLoader(manager);

// Auto-Ground Alignment Helper (সরাসরি মাটির ওপর বসিয়ে দেওয়ার গ্যারান্টি)
function alignToGround(model, targetHeight) {
  const box = new THREE.Box3().setFromObject(model);
  const size = new THREE.Vector3();
  box.getSize(size);
  const center = new THREE.Vector3();
  box.getCenter(center);

  // Center horizontally and set bottom at Y = 0
  model.position.x -= center.x;
  model.position.y -= box.min.y;
  model.position.z -= center.z;

  const wrapper = new THREE.Group();
  wrapper.add(model);

  if (size.y > 0.001) {
    const s = targetHeight / size.y;
    wrapper.scale.set(s, s, s);
  }
  wrapper.traverse(c => {
    if (c.isMesh) {
      c.castShadow = true;
      c.receiveShadow = true;
    }
  });
  return wrapper;
}

// 1. New Astronaut Player Model
const playerGroup = new THREE.Group();
scene.add(playerGroup);

const astronautFile = 'Astronaut by Poly by Google - dLHpzNdygsg.glb';
loader.load(encodeURI(astronautFile), gltf => {
  const aligned = alignToGround(gltf.scene, 1.8);
  aligned.rotation.y = Math.PI; // Face forward
  playerGroup.add(aligned);
}, undefined, () => {
  // Fallback stylish mesh if astronaut file name mismatches
  const fb = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 1.8), new THREE.MeshStandardMaterial({ color: 0x38bdf8 }));
  fb.position.y = 0.9;
  playerGroup.add(fb);
});

// 2. Police Car (Obstacle)
loader.load(encodeURI('Police Car by Quaternius - BwwnUrWGmV.glb'), gltf => {
  ASSETS.car = alignToGround(gltf.scene, 1.3);
});

// 3. Tree
loader.load(encodeURI('Tree by Quaternius - qZtx0AHhcy.glb'), gltf => {
  ASSETS.tree = alignToGround(gltf.scene, 4.2);
});

// 4. Building Red (Fixed Alignment)
loader.load(encodeURI('Building Red by J-Toastie - lbNz2dCIar.glb'), gltf => {
  ASSETS.bldgRed = alignToGround(gltf.scene, 16.0);
});

// 5. Large Building (Kenney - Fixed Alignment)
loader.load(encodeURI('Large Building by Kenney - ppwtREEjXg.glb'), gltf => {
  ASSETS.bldgLarge = alignToGround(gltf.scene, 22.0);
});

// --- Dynamic City Chunks (Road + Sidewalks + Buildings) ---
const CHUNK_LEN = 80;
const chunks = [];

function createChunk(zPos) {
  const group = new THREE.Group();

  // Asphalt Highway Road
  const roadMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(8.5, CHUNK_LEN),
    new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 })
  );
  roadMesh.rotation.x = -Math.PI / 2;
  roadMesh.receiveShadow = true;
  group.add(roadMesh);

  // Sidewalks on both sides
  [-1, 1].forEach(side => {
    const walk = new THREE.Mesh(
      new THREE.BoxGeometry(4.5, 0.35, CHUNK_LEN),
      new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.6 })
    );
    walk.position.set(side * 6.5, 0.17, 0);
    walk.receiveShadow = true;
    group.add(walk);

    // Glowing Neon Road Curbs
    const curb = new THREE.Mesh(
      new THREE.BoxGeometry(0.25, 0.45, CHUNK_LEN),
      new THREE.MeshBasicMaterial({ color: 0xf59e0b })
    );
    curb.position.set(side * 4.35, 0.22, 0);
    group.add(curb);
  });

  // White Highway Lane Dividers
  [-1.2, 1.2].forEach(lx => {
    for (let z = -CHUNK_LEN/2 + 3; z < CHUNK_LEN/2; z += 7) {
      const mark = new THREE.Mesh(new THREE.PlaneGeometry(0.14, 3.5), new THREE.MeshBasicMaterial({ color: 0xffffff }));
      mark.rotation.x = -Math.PI / 2;
      mark.position.set(lx, 0.02, z);
      group.add(mark);
    }
  });

  // Building & Tree Anchor Slots along the sidewalks
  const items = [
    { type: 'bldgRed', offset: 7.5 },
    { type: 'tree', offset: 5.6 },
    { type: 'bldgLarge', offset: 8.0 },
    { type: 'tree', offset: 5.6 }
  ];

  items.forEach((item, idx) => {
    const zOffset = -CHUNK_LEN/2 + 10 + (idx * 18);
    [-1, 1].forEach(side => {
      const anchor = new THREE.Group();
      anchor.position.set(side * item.offset, 0.35, zOffset);
      anchor.rotation.y = side === 1 ? -Math.PI / 2 : Math.PI / 2;
      anchor.userData = { assetKey: item.type };
      group.add(anchor);
    });
  });

  group.position.z = zPos;
  scene.add(group);
  chunks.push(group);
}

// 3 Continuous City Chunks
createChunk(0);
createChunk(-CHUNK_LEN);
createChunk(-CHUNK_LEN * 2);

function populateChunkAssets() {
  chunks.forEach(chunk => {
    chunk.children.forEach(child => {
      if (child.userData && child.userData.assetKey && child.children.length === 0) {
        const tpl = ASSETS[child.userData.assetKey];
        if (tpl) child.add(tpl.clone());
      }
    });
  });
}

// --- Obstacles (Police Cars) & Golden Coins ---
let obstacles = [];
let coins = [];
const coinGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.1, 16);
const coinMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, metalness: 0.9, roughness: 0.15 });

let nextSpawnZ = -30;
function spawnPattern() {
  const laneA = Math.floor(Math.random() * 3);
  let laneB = (laneA + 1 + Math.floor(Math.random() * 2)) % 3;

  // Police Car Obstacle
  let carHolder;
  if (ASSETS.car) {
    carHolder = ASSETS.car.clone();
  } else {
    carHolder = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.2, 2.5), new THREE.MeshStandardMaterial({ color: 0xef4444 }));
    carHolder.position.y = 0.6;
  }
  carHolder.position.set(LANES[laneA], 0, nextSpawnZ);
  scene.add(carHolder);
  obstacles.push(carHolder);

  // Floating Coins
  for (let c = 0; c < 3; c++) {
    const coin = new THREE.Mesh(coinGeo, coinMat);
    coin.rotation.x = Math.PI / 2;
    coin.position.set(LANES[laneB], 0.8, nextSpawnZ - c * 3.5);
    scene.add(coin);
    coins.push(coin);
  }

  nextSpawnZ -= 22;
}

// --- Touch Swipe Controls ---
let touchStartX = 0;
let touchStartY = 0;
const swipeZone = document.getElementById('swipe-zone');

swipeZone.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

swipeZone.addEventListener('touchend', e => {
  if (!isGameActive) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;

  if (Math.abs(dx) > Math.abs(dy)) {
    if (dx > 35 && currentLane < 2) {
      currentLane++; targetX = LANES[currentLane];
    } else if (dx < -35 && currentLane > 0) {
      currentLane--; targetX = LANES[currentLane];
    }
  } else {
    if (dy < -35 && !isJumping) {
      isJumping = true; jumpVelocity = 0.42; Sound.jump();
    }
  }
});

// Keyboard Controls
window.addEventListener('keydown', e => {
  if (!isGameActive) return;
  if ((e.key === 'ArrowLeft' || e.key === 'a') && currentLane > 0) {
    currentLane--; targetX = LANES[currentLane];
  } else if ((e.key === 'ArrowRight' || e.key === 'd') && currentLane < 2) {
    currentLane++; targetX = LANES[currentLane];
  } else if ((e.key === ' ' || e.key === 'ArrowUp') && !isJumping) {
    isJumping = true; jumpVelocity = 0.42; Sound.jump();
  }
});

let isGameActive = false;
let score = 0;
let coinsCount = 0;
let speed = 0.7;

function resetGame() {
  obstacles.forEach(o => scene.remove(o));
  coins.forEach(c => scene.remove(c));
  obstacles = [];
  coins = [];

  nextSpawnZ = -35;
  for (let i = 0; i < 7; i++) spawnPattern();

  currentLane = 1;
  targetX = LANES[1];
  playerGroup.position.set(0, 0, 0);
  score = 0;
  coinsCount = 0;
  speed = 0.7;
  isJumping = false;
  isGameActive = true;
  document.getElementById('coinVal').textContent = "0";
}

function gameOver() {
  isGameActive = false;
  Sound.crash();
  document.getElementById('modalTitle').textContent = "CRASHED!";
  document.getElementById('modalDesc').textContent = `Distance: ${Math.floor(score)}m | Coins: ${coinsCount}`;
  document.getElementById('modalBtn').textContent = "RUN AGAIN";
  document.getElementById('modalOverlay').classList.remove('hide');
}

document.getElementById('modalBtn').addEventListener('click', () => {
  Sound.init();
  document.getElementById('modalOverlay').classList.add('hide');
  resetGame();
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// 60FPS Game Loop
let runTime = 0;
function animate() {
  requestAnimationFrame(animate);

  populateChunkAssets();

  if (isGameActive) {
    score += speed * 0.4;
    document.getElementById('distVal').textContent = Math.floor(score) + "m";
    speed = Math.min(1.25, speed + 0.00007);
    runTime += speed * 0.15;

    // Smooth Lane Shift with banking/tilt
    playerGroup.position.x += (targetX - playerGroup.position.x) * 0.22;
    playerGroup.rotation.z = (playerGroup.position.x - targetX) * 0.15; // Realistic lean into turn!

    // Procedural Running Bobbing (অ্যাস্ট্রোনটের দৌড়ের জীবন্ত মুভমেন্ট)
    if (!isJumping) {
      playerGroup.position.y = Math.abs(Math.sin(runTime * 2.5)) * 0.18;
      playerGroup.rotation.x = 0.1 + Math.sin(runTime * 2.5) * 0.05;
    } else {
      playerGroup.position.y += jumpVelocity;
      jumpVelocity -= gravity;
      playerGroup.rotation.x = -0.2;
      if (playerGroup.position.y <= 0) {
        playerGroup.position.y = 0;
        isJumping = false;
      }
    }

    // Scroll Environment Chunks
    chunks.forEach(chunk => {
      chunk.position.z += speed;
      if (chunk.position.z > CHUNK_LEN) {
        chunk.position.z -= CHUNK_LEN * 3;
      }
    });

    // Move & Check Police Cars
    for (let i = obstacles.length - 1; i >= 0; i--) {
      const obs = obstacles[i];
      obs.position.z += speed;

      if (Math.abs(obs.position.z - playerGroup.position.z) < 1.2 &&
          Math.abs(obs.position.x - playerGroup.position.x) < 1.1 &&
          playerGroup.position.y < 1.1) {
        gameOver();
        break;
      }

      if (obs.position.z > 15) {
        scene.remove(obs);
        obstacles.splice(i, 1);
        spawnPattern();
      }
    }

    // Move & Collect Coins
    for (let i = coins.length - 1; i >= 0; i--) {
      const coin = coins[i];
      coin.position.z += speed;
      coin.rotation.z += 0.06;

      if (Math.abs(coin.position.z - playerGroup.position.z) < 1.0 &&
          Math.abs(coin.position.x - playerGroup.position.x) < 1.0 &&
          playerGroup.position.y < 1.4) {
        coinsCount++;
        document.getElementById('coinVal').textContent = coinsCount;
        Sound.coin();
        scene.remove(coin);
        coins.splice(i, 1);
        continue;
      }

      if (coin.position.z > 15) {
        scene.remove(coin);
        coins.splice(i, 1);
      }
    }
  }

  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
