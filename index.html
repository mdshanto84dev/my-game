<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Garden Blossom Quest</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body { height: 100%; width: 100%; overflow: hidden; background: #0c1810; font-family: 'Quicksand', sans-serif; }

    #game-app {
      position: fixed; inset: 0; display: flex; flex-direction: column; width: 100vw; height: 100vh;
      background: radial-gradient(circle at center, #1b3d27 0%, #0c1810 100%);
    }

    .header-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 16px; background: rgba(0,0,0,0.35); border-bottom: 2px solid rgba(255,255,255,0.08);
    }
    .brand { font-family: 'Fredoka One', cursive; font-size: 20px; color: #7bf1a8; letter-spacing: 1px; }
    .hud { display: flex; gap: 10px; align-items: center; }
    .stat-box { background: rgba(255,255,255,0.12); padding: 4px 12px; border-radius: 12px; text-align: center; }
    .stat-box small { display: block; font-size: 10px; color: #a9dfbf; font-weight: 700; }
    .stat-box b { font-size: 16px; color: #fff; }

    .btn-icon {
      background: rgba(255,255,255,0.15); border: 0; border-radius: 50%; width: 34px; height: 34px;
      cursor: pointer; display: grid; place-items: center; color: #fff; font-size: 16px;
    }

    .stage { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; padding: 8px; }
    #gameCanvas { display: block; max-width: 100vw; max-height: calc(100vh - 80px); aspect-ratio: 1/1; cursor: pointer; }

    .overlay {
      position: absolute; inset: 0; background: rgba(12,24,16,0.88); backdrop-filter: blur(5px);
      display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100;
    }
    .overlay.hide { display: none !important; }
    .card {
      background: #193322; border: 3px solid #336644; border-radius: 24px; padding: 24px 30px;
      text-align: center; box-shadow: 0 16px 32px rgba(0,0,0,0.6); max-width: 320px; width: 90%;
    }
    .card h2 { font-family: 'Fredoka One', cursive; font-size: 30px; color: #ffeb3b; margin-bottom: 8px; }
    .card p { color: #d5f5e3; margin-bottom: 20px; font-weight: 600; font-size: 15px; }
    .card .btn-play {
      background: #2ecc71; color: #0c1810; border: 0; font-family: 'Fredoka One', cursive; font-size: 20px;
      padding: 12px 28px; border-radius: 999px; cursor: pointer; box-shadow: 0 6px 0 #219955;
    }
    .card .btn-play:active { transform: translateY(4px); box-shadow: 0 2px 0 #219955; }
  </style>
</head>
<body>

<div id="game-app">
  <header class="header-bar">
    <div class="brand">Garden Blossom</div>
    <div class="hud">
      <div class="stat-box"><small>SCORE</small><b id="scoreVal">0</b></div>
      <div class="stat-box"><small>TARGET</small><b id="targetVal">1500</b></div>
      <div class="stat-box"><small>MOVES</small><b id="movesVal">20</b></div>
      <button class="btn-icon" id="muteBtn">🔊</button>
    </div>
  </header>

  <main class="stage">
    <canvas id="gameCanvas" width="600" height="600"></canvas>

    <div class="overlay" id="modalOverlay">
      <div class="card">
        <h2 id="modalTitle">Garden Blossom</h2>
        <p id="modalDesc">Match 3 or more flowers to harvest points!</p>
        <button class="btn-play" id="modalBtn">START</button>
      </div>
    </div>
  </main>
</div>

<script>
const AudioSys = {
  ctx: null, muted: false,
  init() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
  },
  tone(f, type, dur, gainVal=0.1) {
    if (this.muted || !this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = type; osc.frequency.value = f;
      g.gain.setValueAtTime(gainVal, this.ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + dur);
      osc.connect(g); g.connect(this.ctx.destination);
      osc.start(); osc.stop(this.ctx.currentTime + dur);
    } catch(e) {}
  },
  swap() { this.tone(420, 'sine', 0.1, 0.08); },
  match() {
    [523, 659, 784].forEach((f, i) => {
      setTimeout(() => this.tone(f, 'triangle', 0.15, 0.1), i * 50);
    });
  },
  win() {
    [440, 554, 659, 880].forEach((f, i) => {
      setTimeout(() => this.tone(f, 'sine', 0.3, 0.15), i * 90);
    });
  },
  lose() {
    [320, 280, 220].forEach((f, i) => {
      setTimeout(() => this.tone(f, 'sawtooth', 0.2, 0.1), i * 110);
    });
  }
};

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const GRID_SIZE = 7;
const CELL_SIZE = canvas.width / GRID_SIZE;

const TILES = [
  { id: 0, color: '#ff4d6d' }, // Rose
  { id: 1, color: '#ffb703' }, // Sunflower
  { id: 2, color: '#2ec4b6' }, // Dewdrop
  { id: 3, color: '#9d4edd' }, // Orchid
  { id: 4, color: '#57cc99' }  // Leaf
];

let board = [];
let selectedTile = null;
let isAnimating = false;
let score = 0;
let targetScore = 1500;
let movesLeft = 20;
let particles = [];

function drawFlower(x, y, size, typeId) {
  ctx.save();
  ctx.translate(x, y);
  const r = size * 0.38;

  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.beginPath(); ctx.arc(0, 0, r + 4, 0, Math.PI * 2); ctx.fill();

  const tile = TILES[typeId];
  ctx.fillStyle = tile.color;

  if (typeId === 0) {
    for (let i = 0; i < 5; i++) {
      ctx.beginPath();
      const a = (i / 5) * Math.PI * 2;
      ctx.arc(Math.cos(a) * (r * 0.45), Math.sin(a) * (r * 0.45), r * 0.45, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = '#ff758f';
    ctx.beginPath(); ctx.arc(0, 0, r * 0.35, 0, Math.PI * 2); ctx.fill();
  } else if (typeId === 1) {
    for (let i = 0; i < 8; i++) {
      ctx.beginPath();
      const a = (i / 8) * Math.PI * 2;
      ctx.arc(Math.cos(a) * (r * 0.55), Math.sin(a) * (r * 0.55), r * 0.32, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = '#6b4226';
    ctx.beginPath(); ctx.arc(0, 0, r * 0.4, 0, Math.PI * 2); ctx.fill();
  } else if (typeId === 2) {
    ctx.beginPath();
    ctx.moveTo(0, -r);
    ctx.quadraticCurveTo(r, r * 0.3, 0, r);
    ctx.quadraticCurveTo(-r, r * 0.3, 0, -r);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(-r * 0.25, -r * 0.1, r * 0.18, 0, Math.PI * 2); ctx.fill();
  } else if (typeId === 3) {
    for (let i = 0; i < 4; i++) {
      ctx.beginPath();
      const a = (i / 4) * Math.PI * 2 + Math.PI / 4;
      ctx.ellipse(Math.cos(a) * (r * 0.4), Math.sin(a) * (r * 0.4), r * 0.5, r * 0.25, a, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = '#ffb703';
    ctx.beginPath(); ctx.arc(0, 0, r * 0.25, 0, Math.PI * 2); ctx.fill();
  } else {
    for (let i = 0; i < 4; i++) {
      ctx.beginPath();
      const a = (i / 4) * Math.PI * 2;
      ctx.arc(Math.cos(a) * (r * 0.45), Math.sin(a) * (r * 0.45), r * 0.38, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = '#38a3a5';
    ctx.beginPath(); ctx.arc(0, 0, r * 0.2, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function initBoard() {
  board = [];
  for (let r = 0; r < GRID_SIZE; r++) {
    board[r] = [];
    for (let c = 0; c < GRID_SIZE; c++) {
      let t;
      do {
        t = Math.floor(Math.random() * TILES.length);
      } while (
        (c >= 2 && board[r][c-1] === t && board[r][c-2] === t) ||
        (r >= 2 && board[r-1][c] === t && board[r-2][c] === t)
      );
      board[r][c] = t;
    }
  }
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let r = 0; r < GRID_SIZE; r++) {
    for (let c = 0; c < GRID_SIZE; c++) {
      ctx.fillStyle = (r + c) % 2 === 0 ? 'rgba(255,255,255,0.06)' : 'rgba(255,255,255,0.02)';
      ctx.beginPath();
      ctx.roundRect(c * CELL_SIZE + 3, r * CELL_SIZE + 3, CELL_SIZE - 6, CELL_SIZE - 6, 12);
      ctx.fill();

      if (selectedTile && selectedTile.r === r && selectedTile.c === c) {
        ctx.strokeStyle = '#ffe600';
        ctx.lineWidth = 4;
        ctx.stroke();
      }

      const typeId = board[r][c];
      if (typeId !== null && typeId !== undefined) {
        drawFlower(c * CELL_SIZE + CELL_SIZE / 2, r * CELL_SIZE + CELL_SIZE / 2, CELL_SIZE, typeId);
      }
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    p.x += p.vx; p.y += p.vy; p.r *= 0.93;
    p.life--;
    if (p.life <= 0 || p.r < 0.5) particles.splice(i, 1);
  }
  requestAnimationFrame(render);
}

function spawnParticles(x, y, col) {
  for (let i = 0; i < 10; i++) {
    const a = Math.random() * Math.PI * 2;
    const spd = Math.random() * 4 + 2;
    particles.push({ x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, r: Math.random() * 4 + 3, col, life: 25 });
  }
}

function checkMatches() {
  const matched = [];
  for (let r = 0; r < GRID_SIZE; r++) {
    for (let c = 0; c < GRID_SIZE; c++) {
      const val = board[r][c];
      if (val === null) continue;

      if (c <= GRID_SIZE - 3 && val === board[r][c+1] && val === board[r][c+2]) {
        let len = 3;
        while (c + len < GRID_SIZE && board[r][c + len] === val) len++;
        for (let i = 0; i < len; i++) matched.push({ r, c: c + i });
      }
      if (r <= GRID_SIZE - 3 && val === board[r+1][c] && val === board[r+2][c]) {
        let len = 3;
        while (r + len < GRID_SIZE && board[r + len][c] === val) len++;
        for (let i = 0; i < len; i++) matched.push({ r: r + i, c });
      }
    }
  }
  return matched;
}

function resolveMatches() {
  const matches = checkMatches();
  if (matches.length === 0) {
    isAnimating = false;
    checkGameState();
    return;
  }

  isAnimating = true;
  AudioSys.match();

  matches.forEach(m => {
    if (board[m.r][m.c] !== null) {
      const col = TILES[board[m.r][m.c]].color;
      spawnParticles(m.c * CELL_SIZE + CELL_SIZE/2, m.r * CELL_SIZE + CELL_SIZE/2, col);
      board[m.r][m.c] = null;
      score += 30;
    }
  });
  document.getElementById('scoreVal').textContent = score;

  setTimeout(() => {
    for (let c = 0; c < GRID_SIZE; c++) {
      let emptyRow = GRID_SIZE - 1;
      for (let r = GRID_SIZE - 1; r >= 0; r--) {
        if (board[r][c] !== null) {
          board[emptyRow][c] = board[r][c];
          if (emptyRow !== r) board[r][c] = null;
          emptyRow--;
        }
      }
      for (let r = emptyRow; r >= 0; r--) {
        board[r][c] = Math.floor(Math.random() * TILES.length);
      }
    }
    setTimeout(resolveMatches, 250);
  }, 200);
}

function swapTiles(r1, c1, r2, c2) {
  AudioSys.swap();
  const tmp = board[r1][c1];
  board[r1][c1] = board[r2][c2];
  board[r2][c2] = tmp;

  const matches = checkMatches();
  if (matches.length > 0) {
    movesLeft--;
    document.getElementById('movesVal').textContent = movesLeft;
    resolveMatches();
  } else {
    setTimeout(() => {
      board[r2][c2] = board[r1][c1];
      board[r1][c1] = tmp;
      isAnimating = false;
    }, 200);
  }
}

function handleTileClick(r, c) {
  if (isAnimating || movesLeft <= 0) return;
  AudioSys.init();

  if (!selectedTile) {
    selectedTile = { r, c };
  } else {
    const d = Math.abs(selectedTile.r - r) + Math.abs(selectedTile.c - c);
    if (d === 1) {
      isAnimating = true;
      swapTiles(selectedTile.r, selectedTile.c, r, c);
      selectedTile = null;
    } else {
      selectedTile = { r, c };
    }
  }
}

canvas.addEventListener('pointerdown', e => {
  const rect = canvas.getBoundingClientRect();
  const scale = canvas.width / rect.width;
  const x = (e.clientX - rect.left) * scale;
  const y = (e.clientY - rect.top) * scale;
  const c = Math.floor(x / CELL_SIZE);
  const r = Math.floor(y / CELL_SIZE);
  if (r >= 0 && r < GRID_SIZE && c >= 0 && c < GRID_SIZE) {
    handleTileClick(r, c);
  }
});

function checkGameState() {
  if (score >= targetScore) {
    AudioSys.win();
    showModal('VICTORY!', 'Target Harvest Achieved!', 'PLAY AGAIN');
  } else if (movesLeft <= 0) {
    AudioSys.lose();
    showModal('GAME OVER', 'Out of Moves! Try again.', 'RETRY');
  }
}

function showModal(title, desc, btnText) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalDesc').textContent = desc;
  document.getElementById('modalBtn').textContent = btnText;
  document.getElementById('modalOverlay').classList.remove('hide');
}

document.getElementById('modalBtn').addEventListener('click', () => {
  AudioSys.init();
  score = 0; movesLeft = 20;
  document.getElementById('scoreVal').textContent = score;
  document.getElementById('movesVal').textContent = movesLeft;
  document.getElementById('modalOverlay').classList.add('hide');
  initBoard();
});

document.getElementById('muteBtn').addEventListener('click', () => {
  AudioSys.init();
  AudioSys.muted = !AudioSys.muted;
  document.getElementById('muteBtn').textContent = AudioSys.muted ? '🔇' : '🔊';
});

initBoard();
render();
</script>
</body>
</html>
