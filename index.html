<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D Business Runner</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0f172a; font-family: 'Quicksand', sans-serif; }
    
    #canvas-container { width: 100vw; height: 100vh; display: block; position: absolute; inset: 0; }

    /* HUD Bar */
    .hud {
      position: absolute; top: 12px; left: 14px; right: 14px;
      display: flex; justify-content: space-between; align-items: center;
      pointer-events: none; z-index: 10;
    }
    .hud-box {
      background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 14px;
      padding: 6px 14px; color: #fff; text-align: center;
    }
    .hud-box small { font-size: 10px; color: #94a3b8; font-weight: 700; display: block; }
    .hud-box b { font-family: 'Fredoka One', cursive; font-size: 18px; color: #facc15; }

    /* Touch Controls Overlay */
    #swipe-zone {
      position: absolute; inset: 0; z-index: 5;
    }

    /* Modal / Overlay */
    .overlay {
      position: absolute; inset: 0; background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(6px);
      display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 20;
    }
    .overlay.hide { display: none !important; }
    .card {
      background: #1e293b; border: 2px solid #334155; border-radius: 24px; padding: 26px 32px;
      text-align: center; box-shadow: 0 16px 36px rgba(0,0,0,0.6); max-width: 320px; width: 90%;
    }
    .card h2 { font-family: 'Fredoka One', cursive; font-size: 32px; color: #38bdf8; margin-bottom: 8px; }
    .card p { color: #cbd5e1; font-size: 14px; margin-bottom: 20px; font-weight: 600; }
    .card .btn-play {
      background: #22c55e; color: #0f172a; border: 0; font-family: 'Fredoka One', cursive; font-size: 20px;
      padding: 12px 30px; border-radius: 999px; cursor: pointer; box-shadow: 0 6px 0 #15803d;
      transition: transform 0.1s;
    }
    .card .btn-play:active { transform: translateY(4px); box-shadow: 0 2px 0 #15803d; }

    #loading-screen {
      position: fixed; inset: 0; background: #0f172a; color: #38bdf8;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      font-family: 'Fredoka One', cursive; font-size: 22px; z-index: 100;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

<div id="loading-screen">
  <span>Loading 3D Runner...</span>
</div>

<div class="hud">
  <div class="hud-box"><small>DISTANCE</small><b id="distVal">0m</b></div>
  <div class="hud-box"><small>COINS</small><b id="coinVal">0</b></div>
</div>

<div id="swipe-zone"></div>
<div id="canvas-container"></div>

<div class="overlay" id="modalOverlay">
  <div class="card">
    <h2 id="modalTitle">3D Runner</h2>
    <p id="modalDesc">Swipe Left/Right to change lanes. Swipe Up to jump!</p>
    <button class="btn-play" id="modalBtn">START RUN</button>
  </div>
</div>

<script>
// --- Web Audio Synthesizer (Zero External Audio Files Needed) ---
const Sound = {
  ctx: null,
  init() {
    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
  },
  coin() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.frequency.setValueAtTime(987, this.ctx.currentTime);
    osc.frequency.setValueAtTime(1318, this.ctx.currentTime + 0.08);
    g.gain.setValueAtTime(0.12, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.25);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.25);
  },
  jump() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(220, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(660, this.ctx.currentTime + 0.15);
    g.gain.setValueAtTime(0.15, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.2);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.2);
  },
  crash() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(140, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.3);
    g.gain.setValueAtTime(0.2, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.35);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.35);
  }
};

// --- Three.js 3D Runner Scene ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f172a);
scene.fog = new THREE.Fog(0x0f172a, 20, 85);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 4.2, 7.5);
camera.lookAt(0, 1.2, -4);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.getElementById('canvas-container').appendChild(renderer.domElement);

// Lights
const ambient = new THREE.AmbientLight(0xffffff, 0.85);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(5, 15, 10);
sun.castShadow = true;
scene.add(sun);

// 3 Track Lanes (Left: -2.3, Center: 0, Right: 2.3)
const LANES = [-2.3, 0, 2.3];
let currentLane = 1; // Center
let targetX = 0;
let isJumping = false;
let jumpVelocity = 0;
const gravity = 0.024;

// Track Environment
const trackGeo = new THREE.PlaneGeometry(8, 120);
const trackMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.6 });
const track1 = new THREE.Mesh(trackGeo, trackMat);
track1.rotation.x = -Math.PI / 2;
track1.receiveShadow = true;
scene.add(track1);

const track2 = track1.clone();
track2.position.z = -120;
scene.add(track2);

// Lane Guide Lines
[-1.15, 1.15].forEach(lx => {
  const lineGeo = new THREE.PlaneGeometry(0.1, 240);
  const lineMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
  const line = new THREE.Mesh(lineGeo, lineMat);
  line.rotation.x = -Math.PI / 2;
  line.position.set(lx, 0.01, -60);
  scene.add(line);
});

// Obstacles & Coins
let obstacles = [];
let coins = [];
const obsGeo = new THREE.BoxGeometry(1.6, 1.4, 1);
const obsMat = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.3 });
const coinGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.12, 16);
const coinMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, metalness: 0.8, roughness: 0.2 });

function spawnRow(zPos) {
  const laneIndex = Math.floor(Math.random() * 3);
  const isObs = Math.random() > 0.35;

  if (isObs) {
    const obs = new THREE.Mesh(obsGeo, obsMat);
    obs.position.set(LANES[laneIndex], 0.7, zPos);
    obs.castShadow = true;
    scene.add(obs);
    obstacles.push(obs);
  }

  // Coins in another lane
  const coinLane = (laneIndex + 1) % 3;
  const coin = new THREE.Mesh(coinGeo, coinMat);
  coin.rotation.x = Math.PI / 2;
  coin.position.set(LANES[coinLane], 0.7, zPos);
  scene.add(coin);
  coins.push(coin);
}

// Player Container
const player = new THREE.Group();
player.position.set(0, 0, 0);
scene.add(player);

let mixer = null;
let isGameActive = false;
let score = 0;
let coinsCount = 0;
let speed = 0.55;

// Load Your 3D Model: Business Man by Quaternius
const loader = new THREE.GLTFLoader();
const modelFileName = 'Business Man by Quaternius - JFrLIKqvCH.glb';

loader.load(
  encodeURI(modelFileName),
  (gltf) => {
    const model = gltf.scene;
    
    // Scale and adjust model height
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const scale = 2.0 / size.y;
    model.scale.set(scale, scale, scale);
    
    // Face the running direction
    model.rotation.y = Math.PI;
    
    model.traverse((node) => {
      if (node.isMesh) {
        node.castShadow = true;
        node.receiveShadow = true;
      }
    });

    player.add(model);

    // Run Animation if available
    if (gltf.animations && gltf.animations.length > 0) {
      mixer = new THREE.AnimationMixer(model);
      const runAnim = gltf.animations.find(a => a.name.toLowerCase().includes('run')) || gltf.animations[0];
      const action = mixer.clipAction(runAnim);
      action.play();
    }

    // Hide Loading Screen
    document.getElementById('loading-screen').style.display = 'none';
  },
  undefined,
  (error) => {
    console.warn("Could not load GLB directly, using stylized 3D runner character", error);
    // Fallback stylish 3D character if loading takes time
    const fbGeo = new THREE.CylinderGeometry(0.5, 0.4, 1.8, 12);
    const fbMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8 });
    const fbMesh = new THREE.Mesh(fbGeo, fbMat);
    fbMesh.position.y = 0.9;
    player.add(fbMesh);
    document.getElementById('loading-screen').style.display = 'none';
  }
);

// --- Mobile Touch Swipe Controls ---
let touchStartX = 0;
let touchStartY = 0;
const swipeZone = document.getElementById('swipe-zone');

swipeZone.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

swipeZone.addEventListener('touchend', (e) => {
  if (!isGameActive) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;

  if (Math.abs(dx) > Math.abs(dy)) {
    // Horizontal Swipe
    if (dx > 35 && currentLane < 2) {
      currentLane++;
      targetX = LANES[currentLane];
    } else if (dx < -35 && currentLane > 0) {
      currentLane--;
      targetX = LANES[currentLane];
    }
  } else {
    // Vertical Swipe (Jump)
    if (dy < -35 && !isJumping) {
      isJumping = true;
      jumpVelocity = 0.38;
      Sound.jump();
    }
  }
});

// Keyboard Controls (For PC Testing)
window.addEventListener('keydown', (e) => {
  if (!isGameActive) return;
  if ((e.key === 'ArrowLeft' || e.key === 'a') && currentLane > 0) {
    currentLane--; targetX = LANES[currentLane];
  } else if ((e.key === 'ArrowRight' || e.key === 'd') && currentLane < 2) {
    currentLane++; targetX = LANES[currentLane];
  } else if ((e.key === ' ' || e.key === 'ArrowUp') && !isJumping) {
    isJumping = true; jumpVelocity = 0.38; Sound.jump();
  }
});

function resetGame() {
  obstacles.forEach(o => scene.remove(o));
  coins.forEach(c => scene.remove(c));
  obstacles = [];
  coins = [];

  for (let z = -20; z > -120; z -= 14) {
    spawnRow(z);
  }

  currentLane = 1;
  targetX = LANES[1];
  player.position.set(0, 0, 0);
  score = 0;
  coinsCount = 0;
  speed = 0.55;
  isJumping = false;
  isGameActive = true;
  document.getElementById('coinVal').textContent = "0";
}

function gameOver() {
  isGameActive = false;
  Sound.crash();
  document.getElementById('modalTitle').textContent = "Game Over!";
  document.getElementById('modalDesc').textContent = `Distance: ${Math.floor(score)}m | Coins: ${coinsCount}`;
  document.getElementById('modalBtn').textContent = "PLAY AGAIN";
  document.getElementById('modalOverlay').classList.remove('hide');
}

document.getElementById('modalBtn').addEventListener('click', () => {
  Sound.init();
  document.getElementById('modalOverlay').classList.add('hide');
  resetGame();
});

// Resize handler
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Main 60FPS Game Loop
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();

  if (mixer) mixer.update(delta);

  if (isGameActive) {
    score += speed * 0.4;
    document.getElementById('distVal').textContent = Math.floor(score) + "m";
    speed = Math.min(1.1, speed + 0.00005); // Gradual speed increase

    // Smooth Lane Shift
    player.position.x += (targetX - player.position.x) * 0.22;

    // Jump Physics
    if (isJumping) {
      player.position.y += jumpVelocity;
      jumpVelocity -= gravity;
      if (player.position.y <= 0) {
        player.position.y = 0;
        isJumping = false;
      }
    }

    // Move Tracks
    track1.position.z += speed;
    track2.position.z += speed;
    if (track1.position.z > 120) track1.position.z = track2.position.z - 120;
    if (track2.position.z > 120) track2.position.z = track1.position.z - 120;

    // Move Obstacles & Collision Check
    for (let i = obstacles.length - 1; i >= 0; i--) {
      const obs = obstacles[i];
      obs.position.z += speed;

      // Box Collision
      if (Math.abs(obs.position.z - player.position.z) < 0.8 &&
          Math.abs(obs.position.x - player.position.x) < 1.1 &&
          player.position.y < 1.2) {
        gameOver();
        break;
      }

      if (obs.position.z > 10) {
        scene.remove(obs);
        obstacles.splice(i, 1);
        spawnRow(-100);
      }
    }

    // Move Coins & Collection Check
    for (let i = coins.length - 1; i >= 0; i--) {
      const coin = coins[i];
      coin.position.z += speed;
      coin.rotation.z += 0.05;

      if (Math.abs(coin.position.z - player.position.z) < 0.9 &&
          Math.abs(coin.position.x - player.position.x) < 1.0 &&
          Math.abs(coin.position.y - player.position.y) < 1.2) {
        coinsCount++;
        document.getElementById('coinVal').textContent = coinsCount;
        Sound.coin();
        scene.remove(coin);
        coins.splice(i, 1);
        continue;
      }

      if (coin.position.z > 10) {
        scene.remove(coin);
        coins.splice(i, 1);
      }
    }
  }

  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
